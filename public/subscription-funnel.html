<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ringo Connect — Get Started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F2E7; --bg2: #F1EADA; --ink: #14142B; --muted: #6B6455;
    --amber: #F2A93B; --amber-ink: #2B1A00; --violet: #6A5AE0;
    --track: rgba(20,20,43,0.12); --shadow: rgba(20,14,4,0.16);
    --box-bg: rgba(255,255,255,0.62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#ECE4D3; font-family:'Manrope',system-ui,-apple-system,sans-serif; color:var(--ink); }
  body { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:18px; }
  .frame { width:100%; max-width:430px; height:min(800px,100dvh - 36px); background:radial-gradient(circle at 50% 28%, var(--bg2) 0%, var(--bg) 62%); border-radius:30px; box-shadow:0 30px 80px var(--shadow), 0 0 0 1px rgba(255,255,255,0.06); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .progress { display:flex; gap:5px; padding:16px 18px 0; }
  .progress .seg { flex:1; height:3px; border-radius:2px; background:var(--track); overflow:hidden; }
  .progress .seg .fill { height:100%; width:0%; background:var(--amber); border-radius:2px; transition:width .25s ease; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 18px 4px; color:var(--muted); font-size:12.5px; font-weight:600; }
  .topbar .brand { display:flex; align-items:center; gap:7px; }
  .topbar .dot { width:6px; height:6px; border-radius:50%; background:var(--amber); }
  .topbar .count { font-variant-numeric:tabular-nums; opacity:.8; }
  .stage { position:relative; flex:1; overflow:hidden; }
  .tapzone { position:absolute; top:0; bottom:0; width:42%; z-index:6; }
  .tapzone.left { left:0; } .tapzone.right { right:0; }
  .page { position:absolute; inset:0; padding:10px 30px 26px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; background:var(--bg); opacity:0; transform:scale(0.97); transition:opacity .32s ease, transform .32s ease; pointer-events:none; }
  .page.active { opacity:1; transform:scale(1); pointer-events:auto; }
  .badge { position:relative; width:108px; height:108px; margin-bottom:26px; display:flex; align-items:center; justify-content:center; flex-shrink:0; opacity:0; transform:translateY(10px) scale(0.9); transition:opacity .5s ease .05s, transform .5s cubic-bezier(.2,.8,.2,1) .05s; }
  .page.active .badge { opacity:1; transform:translateY(0) scale(1); }
  .badge .ring { position:absolute; inset:0; border-radius:50%; background:var(--ring-color, rgba(242,169,59,0.16)); }
  .badge .ripple { position:absolute; inset:0; border-radius:50%; background:var(--amber); opacity:.3; }
  @media (prefers-reduced-motion: no-preference) { .page.active .badge.animated .ripple { animation:pulse 2s ease-out infinite; } }
  @keyframes pulse { 0%{transform:scale(.72);opacity:.45;} 100%{transform:scale(1.85);opacity:0;} }
  .badge svg { position:relative; width:52px; height:52px; color:var(--icon-color, var(--amber)); }
  .q { font-family:'Space Grotesk',system-ui,sans-serif; font-size:27px; font-weight:700; line-height:1.18; letter-spacing:-0.01em; margin:0 0 13px; max-width:15ch; color:var(--ink); opacity:0; transform:translateY(14px); transition:opacity .5s ease .12s, transform .5s cubic-bezier(.2,.8,.2,1) .12s; }
  .page.active .q { opacity:1; transform:translateY(0); }
  .a-box { background:var(--box-bg); border-left:3px solid var(--page-accent, var(--amber)); border-radius:4px 16px 16px 4px; padding:16px 18px; box-shadow:0 10px 28px rgba(20,14,4,0.08); max-width:33ch; opacity:0; transform:translateY(18px) scale(0.93) rotate(-1.2deg); transition:opacity .6s cubic-bezier(.16,1,.3,1) .22s, transform .6s cubic-bezier(.16,1,.3,1) .22s; }
  .page.active .a-box { opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  .a-box.box-dark { background:#14142B; box-shadow:0 10px 28px rgba(20,14,4,0.14); }
  .a-box.box-dark .a { color:var(--a-text-color, #F7F2E7); }
  .a-label { font-size:12.5px; font-weight:800; color:var(--page-accent, var(--amber)); margin:0 0 6px; }
  .a { font-size:16.5px; line-height:1.65; color:var(--ink); margin:0; font-weight:600; }
  .cta-page .q { font-size:30px; max-width:12ch; }
  .cta-row { position:relative; z-index:10; display:flex; flex-direction:column; gap:10px; margin-top:24px; width:100%; opacity:0; transform:translateY(14px); transition:opacity .5s ease .28s, transform .5s cubic-bezier(.2,.8,.2,1) .28s; }
  .page.active .cta-row { opacity:1; transform:translateY(0); }
  .cta-btn { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--amber); color:var(--amber-ink); font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; padding:17px 20px; border-radius:15px; text-decoration:none; border:none; cursor:pointer; box-shadow:0 14px 30px rgba(242,169,59,0.28); }
  .cta-btn-secondary { display:flex; align-items:center; justify-content:center; gap:6px; background:rgba(20,14,4,0.045); color:var(--ink); font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px; padding:14px 18px; border-radius:14px; text-decoration:none; border:1.5px solid rgba(20,14,4,0.14); }
  .cta-sub { margin-top:4px; font-size:12.5px; color:var(--muted); text-align:center; }
  .navbar { display:flex; align-items:center; justify-content:space-between; padding:6px 22px 22px; gap:12px; }
  .nav-btn { font-family:'Manrope',sans-serif; font-size:14px; font-weight:600; background:none; border:none; color:var(--muted); cursor:pointer; padding:10px 6px; }
  .nav-btn:disabled { visibility:hidden; }
  .next-pill { font-family:'Manrope',sans-serif; font-size:14px; font-weight:800; background:var(--ink); color:var(--bg); border:none; border-radius:999px; padding:13px 24px; cursor:pointer; }
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="progress" id="progress"></div>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Ringo Connect</div>
    <div class="count" id="count">1 / 14</div>
  </div>
  <div class="stage" id="stage">
    <div class="tapzone left" id="zoneLeft"></div>
    <div class="tapzone right" id="zoneRight"></div>
  </div>
  <div class="navbar">
    <button class="nav-btn" id="backBtn">Back</button>
    <button class="next-pill" id="nextBtn">Next</button>
  </div>
</div>

<script>
  // ── Dynamic per-link attribution — same mechanism as public/card-funnel.html ──
  // Reads ?ref=CODE from this page's own URL and uses it to:
  //   1) carry that ref into the plain /get-started link below (no card=1 —
  //      that's the deliberate difference from the card funnel), and
  //   2) look up the referrer's own WhatsApp number via the SAME read-only
  //      /api/public/card-funnel-referrer endpoint the card funnel already
  //      uses (its lookup logic has nothing card-specific about it — just
  //      its name — so it's reused here as-is rather than duplicated).
  // Falls back to the platform default number whenever there's no ref, the
  // lookup fails, or the referrer has no whatsapp_number set.
  const DEFAULT_WHATSAPP_NUMBER = "237694028846";
  const refCode = new URLSearchParams(window.location.search).get("ref");
  let SALES_LINK = "https://ringoconnectltd.com/get-started" + (refCode ? "?ref=" + encodeURIComponent(refCode) : "");
  let WHATSAPP_NUMBER = DEFAULT_WHATSAPP_NUMBER;

  async function resolveWhatsappNumber() {
    if (!refCode) return;
    try {
      const res = await fetch("/api/public/card-funnel-referrer?ref=" + encodeURIComponent(refCode));
      if (!res.ok) return;
      const data = await res.json();
      if (data && typeof data.whatsapp_number === "string" && data.whatsapp_number.trim()) {
        WHATSAPP_NUMBER = data.whatsapp_number.trim();
      }
    } catch {
      // Network hiccup — keep the default number, nothing else to do.
    }
  }

  const ICONS = {
    page: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="14" width="64" height="72" rx="12"/>
      <circle cx="50" cy="34" r="10"/>
      <path d="M32 56h36M32 66h36M32 76h24"/>
    </svg>`,
    value: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="24" width="52" height="38" rx="8"/><path d="M16 40h52"/>
      <circle cx="72" cy="66" r="18" fill="#0B0B24"/><path d="M64 66l6 6 12-13"/>
    </svg>`,
    star: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 14l10 22 24 3-18 17 5 24-21-12-21 12 5-24-18-17 24-3z"/>
    </svg>`,
    shop: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 32l6-16h44l6 16"/><path d="M18 32v10a9 9 0 0018 0 9 9 0 0018 0 9 9 0 0018 0v-10"/>
      <path d="M24 42v34h44V42"/><path d="M40 76V56h12v20"/>
    </svg>`,
    check: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="34"/><path d="M35 51l10 11 22-24"/>
    </svg>`,
    payment: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="30" y="12" width="36" height="62" rx="9"/><path d="M30 58h36"/>
      <circle cx="48" cy="36" r="13"/><path d="M42 36l4 4 8-9"/>
    </svg>`,
    team: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="38" cy="36" r="12"/><path d="M18 74c3-14 12-20 20-20s17 6 20 20"/>
      <circle cx="66" cy="40" r="10"/><path d="M50 78c3-11 10-16 16-16s13 5 16 16" opacity=".85"/>
    </svg>`,
    repeat: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 40a24 24 0 0142-15"/><path d="M76 60a24 24 0 01-42 15"/>
      <path d="M58 15l8 10-11 4M42 85l-8-10 11-4"/><circle cx="50" cy="50" r="6" fill="currentColor" stroke="none"/>
    </svg>`,
    clock: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="34"/><path d="M50 30v20l14 10"/>
    </svg>`,
    link: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="34" width="34" height="34" rx="15"/><rect x="52" y="34" width="34" height="34" rx="15"/>
      <path d="M40 51h20"/>
    </svg>`,
    upgrade: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 78h68"/><rect x="24" y="56" width="12" height="18"/><rect x="44" y="44" width="12" height="30"/>
      <rect x="64" y="28" width="12" height="46"/><path d="M62 20l14-4 4 14" opacity=".85"/>
    </svg>`,
    faq: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 26h64a6 6 0 016 6v30a6 6 0 01-6 6H46l-16 14V68H18a6 6 0 01-6-6V32a6 6 0 016-6z"/>
      <circle cx="38" cy="48" r="3" fill="currentColor" stroke="none"/><circle cx="50" cy="48" r="3" fill="currentColor" stroke="none"/>
      <circle cx="62" cy="48" r="3" fill="currentColor" stroke="none"/>
    </svg>`
  };

  const pages = [
    { intro: true, q: "Quick questions about Ringo Connect", a: "Here are the 12 things people usually ask before getting started. Tap through — it only takes a minute.", icon: "faq", animated: true, ring: "rgba(242,169,59,0.18)" },
    { q: "What is Ringo Connect?", a: "One page for your business or personal brand — links, catalog, bookings, and real ordering, all in one place. No website needed.", icon: "page", animated: true, ring: "rgba(242,169,59,0.18)" },
    { q: "How much does it cost?", a: "You can start completely free. Paid plans start at 1,000 FCFA/month if you want extra features like custom themes, more links, and priority tools.", icon: "value", ring: "rgba(242,169,59,0.18)" },
    { q: "What do I get for free?", a: "A real page with a link, a catalog item, and social icons — enough to try it out before you commit to anything.", icon: "star", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)" },
    { q: "Can I actually sell things through it?", a: "Yes — on a paid plan you get real ordering for restaurants, real checkout and ticketing for music/events, and a booking system for any business.", icon: "shop", ring: "rgba(242,169,59,0.18)" },
    { q: "Do I need to know how to code?", a: "No — you just fill in your info and pick your style. No technical or design skills needed at all.", icon: "check", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)" },
    { q: "How do I get paid?", a: "Straight to your MTN or Orange Mobile Money — no bank account or card needed on your end.", icon: "payment", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)" },
    { q: "Can I add staff or team members?", a: "Yes, on our Business plans — invite up to 3 or 7 people, each with their own role and permissions.", icon: "team", ring: "rgba(242,169,59,0.18)" },
    { q: "What if I want to cancel?", a: "Mobile money plans don't auto-renew — if you don't pay again, your account simply continues on Free. No surprise charges, ever.", icon: "repeat", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)" },
    { q: "How long does setup take?", a: "A few minutes — pick your category, fill in your info, and your page is live.", icon: "clock", ring: "rgba(242,169,59,0.18)" },
    { q: "Does this replace my website?", a: "For most small businesses and creators, yes — one link does everything a basic website would, built for sharing on WhatsApp and social media.", icon: "link", ring: "rgba(242,169,59,0.18)" },
    { q: "Can I upgrade or downgrade later?", a: "Anytime, right from your dashboard — nothing is locked in.", icon: "upgrade", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)" },
    { cta: true, q: "Ready to get started?", a: "It takes just a couple minutes to set up your page — start free or pick a plan, and you're live.", icon: "check", animated: true, ring: "rgba(242,169,59,0.2)" }
  ];

  const stage = document.getElementById('stage');
  const progressEl = document.getElementById('progress');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const countEl = document.getElementById('count');
  let current = 0;

  async function init() {
  // Resolve the referrer's WhatsApp number (if any) before building the
  // CTA page below, so its links are correct from the very first paint.
  await resolveWhatsappNumber();

  pages.forEach(() => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.innerHTML = '<div class="fill"></div>';
    progressEl.appendChild(seg);
  });
  const segFills = () => document.querySelectorAll('.progress .fill');

  pages.forEach((p, index) => {
    const isFaq = !p.cta && !p.intro;
    const div = document.createElement('div');
    div.className = 'page' + (p.cta ? ' cta-page' : '');

    const badge = document.createElement('div');
    badge.className = 'badge' + (p.animated ? ' animated' : '');
    badge.style.setProperty('--ring-color', p.ring || 'rgba(242,169,59,0.18)');
    badge.style.setProperty('--icon-color', p.iconColor || 'var(--amber)');
    badge.innerHTML = '<div class="ring"></div>' + (p.animated ? '<div class="ripple"></div>' : '') + ICONS[p.icon];
    div.appendChild(badge);

    const q = document.createElement('h1');
    q.className = 'q';
    q.textContent = p.q;
    div.appendChild(q);

    const isViolet = p.iconColor === 'var(--violet)';
    const aBox = document.createElement('div');
    aBox.className = 'a-box box-dark';
    aBox.style.setProperty('--page-accent', p.iconColor || 'var(--amber)');
    aBox.style.setProperty('--a-text-color', isViolet ? '#DCD5FF' : '#FBE7C6');
    if (isFaq) {
      const label = document.createElement('div');
      label.className = 'a-label';
      label.textContent = 'Answer';
      aBox.appendChild(label);
    }
    const a = document.createElement('p');
    a.className = 'a';
    a.textContent = p.a;
    aBox.appendChild(a);
    div.appendChild(aBox);

    if (p.cta) {
      const row = document.createElement('div');
      row.className = 'cta-row';

      const btn = document.createElement('a');
      btn.className = 'cta-btn';
      btn.href = SALES_LINK;
      btn.target = '_top';
      btn.textContent = 'Yes, Let’s Get Started';
      row.appendChild(btn);

      const waMsg = encodeURIComponent("Hi! I have a question about Ringo Connect before I sign up 🙂");
      const waBtn = document.createElement('a');
      waBtn.className = 'cta-btn-secondary';
      waBtn.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + waMsg;
      waBtn.target = '_top';
      waBtn.textContent = 'Not now, I have a question';
      row.appendChild(waBtn);

      const sub = document.createElement('p');
      sub.className = 'cta-sub';
      sub.textContent = 'Free to start — upgrade anytime by MTN or Orange Money.';
      row.appendChild(sub);

      div.appendChild(row);
    }

    stage.appendChild(div);
  });

  function render() {
    document.querySelectorAll('.page').forEach((el, i) => el.classList.toggle('active', i === current));
    segFills().forEach((fill, i) => { fill.style.width = i <= current ? '100%' : '0%'; });
    backBtn.disabled = current === 0;
    nextBtn.textContent = current === pages.length - 1 ? 'Start over' : 'Next';
    countEl.textContent = (current + 1) + ' / ' + pages.length;
  }
  function goNext() { current = current < pages.length - 1 ? current + 1 : 0; render(); }
  function goBack() { if (current > 0) { current--; render(); } }

  document.getElementById('zoneRight').addEventListener('click', goNext);
  document.getElementById('zoneLeft').addEventListener('click', goBack);
  nextBtn.addEventListener('click', goNext);
  backBtn.addEventListener('click', goBack);
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') goNext(); if (e.key === 'ArrowLeft') goBack(); });

  let touchStartX = null;
  stage.addEventListener('touchstart', (e) => {
    // Let a tap that starts on a real link/button (e.g. the CTA buttons)
    // behave like a normal tap instead of being read as a swipe.
    if (e.target.closest('a, button')) { touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
  });
  stage.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    if (e.target.closest('a, button')) { touchStartX = null; return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? goNext() : goBack(); }
    touchStartX = null;
  });

  render();
  }

  init();
</script>
</body>
</html>
