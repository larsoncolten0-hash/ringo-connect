<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ringo Card — Tap. Share. Sell.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F2E7;
    --bg2: #F1EADA;
    --ink: #14142B;
    --muted: #6B6455;
    --amber: #F2A93B;
    --amber-ink: #2B1A00;
    --violet: #6A5AE0;
    --track: rgba(20,20,43,0.12);
    --shadow: rgba(20,14,4,0.16);
    --box-bg: rgba(255,255,255,0.62);
  }
  :root[data-theme="light"] {
    --bg: #F7F2E7; --bg2: #F1EADA; --ink: #14142B; --muted: #6B6455;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ECE4D3;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  body {
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }

  .frame {
    width: 100%; max-width: 430px;
    height: min(800px, 100dvh - 36px);
    background: radial-gradient(circle at 50% 28%, var(--bg2) 0%, var(--bg) 62%);
    border-radius: 30px;
    box-shadow: 0 30px 80px var(--shadow), 0 0 0 1px rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .progress { display: flex; gap: 5px; padding: 16px 18px 0; }
  .progress .seg { flex: 1; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .progress .seg .fill { height: 100%; width: 0%; background: var(--amber); border-radius: 2px; transition: width .25s ease; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 4px; color: var(--muted); font-size: 12.5px; font-weight: 600;
  }
  .topbar .brand { display: flex; align-items: center; gap: 7px; }
  .topbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .topbar .count { font-variant-numeric: tabular-nums; opacity: .8; }

  .stage { position: relative; flex: 1; overflow: hidden; }
  .tapzone { position: absolute; top: 0; bottom: 0; width: 42%; z-index: 6; }
  .tapzone.left { left: 0; } .tapzone.right { right: 0; }

  .page {
    position: absolute; inset: 0;
    padding: 10px 30px 26px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    background: var(--bg);
    opacity: 0; transform: scale(0.97);
    transition: opacity .32s ease, transform .32s ease;
    pointer-events: none;
  }
  .page.active { opacity: 1; transform: scale(1); pointer-events: auto; }

  .badge {
    position: relative; width: 108px; height: 108px; margin-bottom: 26px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    opacity: 0; transform: translateY(10px) scale(0.9);
    transition: opacity .5s ease .05s, transform .5s cubic-bezier(.2,.8,.2,1) .05s;
  }
  .page.active .badge { opacity: 1; transform: translateY(0) scale(1); }
  .badge .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--ring-color, rgba(242,169,59,0.16)); }
  .badge .ripple { position: absolute; inset: 0; border-radius: 50%; background: var(--amber); opacity: .3; }
  @media (prefers-reduced-motion: no-preference) {
    .page.active .badge.animated .ripple { animation: pulse 2s ease-out infinite; }
  }
  @keyframes pulse { 0% { transform: scale(.72); opacity: .45; } 100% { transform: scale(1.85); opacity: 0; } }
  .badge svg { position: relative; width: 52px; height: 52px; color: var(--icon-color, var(--amber)); }

  .q {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 27px; font-weight: 700; line-height: 1.18; letter-spacing: -0.01em;
    margin: 0 0 13px; max-width: 15ch;
    color: var(--ink);
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease .12s, transform .5s cubic-bezier(.2,.8,.2,1) .12s;
  }
  .page.active .q { opacity: 1; transform: translateY(0); }

  .a-box {
    background: var(--box-bg);
    border-left: 3px solid var(--page-accent, var(--amber));
    border-radius: 4px 16px 16px 4px;
    padding: 16px 18px;
    box-shadow: 0 10px 28px rgba(20,14,4,0.08);
    max-width: 33ch;
    opacity: 0; transform: translateY(18px) scale(0.93) rotate(-1.2deg);
    transition: opacity .6s cubic-bezier(.16,1,.3,1) .22s,
                transform .6s cubic-bezier(.16,1,.3,1) .22s;
  }
  .page.active .a-box { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  .a-box.box-dark {
    background: #14142B;
    box-shadow: 0 10px 28px rgba(20,14,4,0.14);
  }
  .a-box.box-dark { color: inherit; }
  .a-box.box-dark .a { color: var(--a-text-color, #F7F2E7); }
  .a-label {
    font-size: 12.5px; font-weight: 800; color: var(--page-accent, var(--amber));
    margin: 0 0 6px;
  }
  .a {
    font-size: 16.5px; line-height: 1.65; color: var(--ink); margin: 0; font-weight: 600;
  }

  .cta-page .q { font-size: 30px; max-width: 12ch; }
  .cta-row {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; gap: 10px; margin-top: 24px; width: 100%;
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease .28s, transform .5s cubic-bezier(.2,.8,.2,1) .28s;
  }
  .page.active .cta-row { opacity: 1; transform: translateY(0); }

  .cta-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--amber); color: var(--amber-ink);
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px;
    padding: 17px 20px; border-radius: 15px; text-decoration: none; border: none; cursor: pointer;
    box-shadow: 0 14px 30px rgba(242,169,59,0.28);
  }
  .cta-btn-secondary {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(20,14,4,0.045); color: var(--ink);
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14.5px;
    padding: 14px 18px; border-radius: 14px; text-decoration: none;
    border: 1.5px solid rgba(20,14,4,0.14);
  }
  .cta-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); text-align: center; }

  .navbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 22px 22px; gap: 12px; }
  .nav-btn { font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; background: none; border: none; color: var(--muted); cursor: pointer; padding: 10px 6px; }
  .nav-btn:disabled { visibility: hidden; }
  .next-pill { font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 800; background: var(--ink); color: var(--bg); border: none; border-radius: 999px; padding: 13px 24px; cursor: pointer; }
  .lang-btn { font-family: 'Manrope', sans-serif; font-size: 11.5px; font-weight: 800; background: rgba(20,14,4,0.06); color: var(--muted); border: 1px solid rgba(20,14,4,0.14); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="progress" id="progress"></div>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Ringo Card</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="count" id="count">1 / 13</div>
      <button class="lang-btn" id="langBtn" aria-label="Switch language">FR</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="tapzone left" id="zoneLeft"></div>
    <div class="tapzone right" id="zoneRight"></div>
  </div>
  <div class="navbar">
    <button class="nav-btn" id="backBtn">Back</button>
    <button class="next-pill" id="nextBtn">Next</button>
  </div>
</div>

<script>
  // ── Dynamic per-link attribution ──
  // Reads ?ref=CODE from this page's own URL (the affiliate/admin code the
  // link was generated with — see SalesFunnelLinkCard.tsx) and uses it to:
  //   1) carry that ref into the get-started signup link below, and
  //   2) look up the referrer's own WhatsApp number (via the read-only
  //      /api/public/card-funnel-referrer endpoint) so the "I have a
  //      question" button reaches the person who actually shared this
  //      link, not a generic line. Falls back to the platform default
  //      number below whenever there's no ref, the lookup fails, or the
  //      referrer has no whatsapp_number set.
  const DEFAULT_WHATSAPP_NUMBER = "237694028846";
  const refCode = new URLSearchParams(window.location.search).get("ref");
  let SALES_LINK = "https://ringoconnectltd.com/get-started?card=1" + (refCode ? "&ref=" + encodeURIComponent(refCode) : "");
  let WHATSAPP_NUMBER = DEFAULT_WHATSAPP_NUMBER;

  async function resolveWhatsappNumber() {
    if (!refCode) return;
    try {
      const res = await fetch("/api/public/card-funnel-referrer?ref=" + encodeURIComponent(refCode));
      if (!res.ok) return;
      const data = await res.json();
      if (data && typeof data.whatsapp_number === "string" && data.whatsapp_number.trim()) {
        WHATSAPP_NUMBER = data.whatsapp_number.trim();
      }
    } catch {
      // Network hiccup — keep the default number, nothing else to do.
    }
  }

  // ── Bilingual EN/FR — same "ringo-lang" localStorage key and default-to-French
  // detection as src/components/LanguageProvider.tsx, so a language choice made
  // here carries over into the main app (and vice versa) automatically.
  const LOCALE_KEY = "ringo-lang";
  function detectLocale() {
    try {
      const saved = localStorage.getItem(LOCALE_KEY);
      if (saved === "en" || saved === "fr") return saved;
    } catch {}
    return navigator.language.toLowerCase().startsWith("en") ? "en" : "fr";
  }
  let locale = detectLocale();

  const UI = {
    en: {
      title: "Ringo Card — Tap. Share. Sell.",
      back: "Back", next: "Next", startOver: "Start over", answer: "Answer",
      ctaBtn: "Yes, Get My Ringo Card",
      notNow: "Not now, I have a question",
      sub: "Pay by MTN or Orange Money — takes about 2 minutes.",
      waMsg: "Hi! I have a question about the Ringo Card before I order 🙂"
    },
    fr: {
      title: "Ringo Card — Tapez. Partagez. Vendez.",
      back: "Retour", next: "Suivant", startOver: "Recommencer", answer: "Réponse",
      ctaBtn: "Oui, je veux ma Ringo Card",
      notNow: "Pas maintenant, j'ai une question",
      sub: "Payez par MTN ou Orange Money — environ 2 minutes.",
      waMsg: "Bonjour ! J'ai une question sur la Ringo Card avant de commander 🙂"
    }
  };

  const ICONS = {
    tap: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="30" width="46" height="46" rx="9"/>
      <circle cx="37" cy="53" r="7"/>

    </svg>`,
    value: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="24" width="52" height="38" rx="8"/>
      <path d="M16 40h52"/>
      <circle cx="72" cy="66" r="18" fill="#0B0B24"/>
      <path d="M64 66l6 6 12-13"/>
    </svg>`,
    calendar: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="22" width="60" height="54" rx="8"/>
      <path d="M16 38h60"/>
      <path d="M32 14v14M60 14v14"/>
      <circle cx="46" cy="58" r="12"/>

    </svg>`,
    globe: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
      <circle cx="46" cy="50" r="30"/>
      <path d="M16 50h60"/>

    </svg>`,
    shop: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 32l6-16h44l6 16"/>
      <path d="M18 32v10a9 9 0 0018 0 9 9 0 0018 0 9 9 0 0018 0v-10"/>

    </svg>`,
    payment: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="30" y="12" width="36" height="62" rx="9"/>

    </svg>`,
    shield: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 14l28 10v22c0 20-12 32-28 40-16-8-28-20-28-40V24z"/>
      <path d="M38 50l9 9 17-19"/>
    </svg>`,
    delivery: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="36" width="42" height="28" rx="5"/>

      <circle cx="72" cy="70" r="8"/>
    </svg>`,
    link: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="34" width="34" height="34" rx="15"/>

    person: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="18" width="64" height="64" rx="14"/>

    </svg>`,
    upgrade: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 78h68"/>
      <rect x="24" y="56" width="12" height="18"/>
      <rect x="44" y="44" width="12" height="30"/>
      <rect x="64" y="28" width="12" height="46"/>
      <path d="M62 20l14-4 4 14" opacity=".85"/>
    </svg>`,
    check: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="34"/>
      <path d="M35 51l10 11 22-24"/>
    </svg>`,
    faq: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 26h64a6 6 0 016 6v30a6 6 0 01-6 6H46l-16 14V68H18a6 6 0 01-6-6V32a6 6 0 016-6z"/>
      <circle cx="38" cy="48" r="3" fill="currentColor" stroke="none"/>
      <circle cx="50" cy="48" r="3" fill="currentColor" stroke="none"/>
      <circle cx="62" cy="48" r="3" fill="currentColor" stroke="none"/>
    </svg>`
  };

  const pages = [
    { intro: true, icon: "faq", animated: true, ring: "rgba(242,169,59,0.18)",
      q: { en: "Got questions? Good — let's answer them.", fr: "Des questions ? Parfait, on y répond." },
      a: { en: "Here are the 12 things people usually ask before getting their Ringo Card. Tap through — it only takes a minute.", fr: "Voici les 12 questions qu'on nous pose le plus souvent avant de prendre la Ringo Card. Avancez en tapant — ça prend une minute." } },
    { icon: "tap", animated: true, ring: "rgba(242,169,59,0.18)",
      q: { en: "What is the Ringo Card?", fr: "C'est quoi la Ringo Card ?" },
      a: { en: "It's a smart physical card — you tap it on any phone and it opens your Ringo Connect page instantly. No app needed for the person tapping it. It's like a digital business card that also runs your shop, bookings, or page.", fr: "C'est une carte physique intelligente — on la tape sur n'importe quel téléphone et elle ouvre instantanément votre page Ringo Connect. Aucune application n'est nécessaire pour la personne qui tape. C'est comme une carte de visite digitale qui gère aussi votre boutique, vos réservations ou votre page." } },
    { icon: "value", ring: "rgba(242,169,59,0.18)",
      q: { en: "How much is it?", fr: "Combien ça coûte ?" },
      a: { en: "3,500 FCFA — that includes the physical card AND your first month of Ringo Connect Basic (real ordering, bookings, custom page, everything) at no extra cost.", fr: "3 500 FCFA — ça inclut la carte physique ET votre premier mois de Ringo Connect Basic (commandes réelles, réservations, page personnalisée, tout) sans frais supplémentaires." } },
    { icon: "calendar", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)",
      q: { en: "What happens after the 1 month?", fr: "Que se passe-t-il après le 1er mois ?" },
      a: { en: "Nothing forces you to pay again — your account just continues on our Free plan automatically. If you want to keep the extra features, you can renew Basic anytime for 1,000 FCFA/month, but it's completely your choice.", fr: "Rien ne vous oblige à repayer — votre compte continue automatiquement sur notre plan Gratuit. Si vous voulez garder les fonctionnalités en plus, vous pouvez renouveler Basic à tout moment pour 1 000 FCFA/mois, mais c'est entièrement votre choix." } },
    { icon: "globe", ring: "rgba(242,169,59,0.18)",
      q: { en: "Is this only for businesses?", fr: "C'est seulement pour les entreprises ?" },
      a: { en: "No — anyone can use it. Musicians, restaurants, shops, freelancers, or just you personally as a link-in-bio for your socials and contact info.", fr: "Non — tout le monde peut l'utiliser. Musiciens, restaurants, boutiques, freelances, ou juste vous, personnellement, comme lien pour vos réseaux sociaux et vos coordonnées." } },
    { icon: "shop", ring: "rgba(242,169,59,0.18)",
      q: { en: "Can I use it for my restaurant, music, or shop?", fr: "Je peux l'utiliser pour mon restaurant, ma musique ou ma boutique ?" },
      a: { en: "Yes. Restaurant owners get a real digital menu + ordering system. Musicians get track sales, ticketing, and payouts. Everyone else gets a page, catalog, and booking system.", fr: "Oui. Les restaurateurs obtiennent un vrai menu digital + système de commande. Les musiciens ont la vente de titres, la billetterie et les paiements. Tous les autres ont une page, un catalogue et un système de réservation." } },
    { icon: "payment", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)",
      q: { en: "How do I pay?", fr: "Comment je paie ?" },
      a: { en: "MTN Mobile Money or Orange Money, directly on the site — no card needed, no bank account. You just confirm on your phone.", fr: "MTN Mobile Money ou Orange Money, directement sur le site — pas de carte bancaire, pas de compte bancaire. Vous confirmez juste sur votre téléphone." } },
    { icon: "shield", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)",
      q: { en: "Is it safe?", fr: "Est-ce sécurisé ?" },
      a: { en: "You approve the payment yourself on your own phone through MTN/Orange Money's own confirmation prompt — nothing happens without you personally accepting it.", fr: "Vous approuvez vous-même le paiement sur votre propre téléphone via le message de confirmation MTN/Orange Money — rien ne se passe sans que vous l'acceptiez personnellement." } },
    { icon: "delivery", ring: "rgba(242,169,59,0.18)",
      q: { en: "How long until I get the card?", fr: "En combien de temps je reçois ma carte ?" },
      a: { en: "1–3 working days in Yaoundé/Douala, pickup available at Total Jouvance — or delivered to you at your own expense. We also ship to other zones.", fr: "1 à 3 jours ouvrés à Yaoundé/Douala, retrait possible à Total Jouvance — ou livraison à vos frais. Nous livrons aussi dans d'autres zones." } },
    { icon: "link", ring: "rgba(242,169,59,0.18)",
      q: { en: "Can I get just the card, without the subscription?", fr: "Puis-je avoir juste la carte, sans l'abonnement ?" },
      a: { en: "No — Ringo Connect Cards are linked directly to Ringo Connect profiles, so we don't sell them without a subscription. That's exactly why the card price already includes your first month free.", fr: "Non — les Ringo Connect Cards sont directement liées aux profils Ringo Connect, donc nous ne les vendons pas sans abonnement. C'est justement pour ça que le prix de la carte inclut déjà votre premier mois gratuit." } },
    { icon: "repeat", ring: "rgba(140,124,247,0.18)", iconColor: "var(--violet)",
      q: { en: "Do I have to pay 3,500 FCFA every month?", fr: "Dois-je payer 3 500 FCFA tous les mois ?" },
      a: { en: "No — 3,500 FCFA is a one-time payment for the card only. After your first month, stay on Free for nothing, or pay 1,000 FCFA/month to keep the extra features. It's your choice.", fr: "Non — 3 500 FCFA est un paiement unique pour la carte seulement. Après votre premier mois, restez sur Gratuit sans rien payer, ou payez 1 000 FCFA/mois pour garder les fonctionnalités en plus. C'est votre choix." } },
    { icon: "person", ring: "rgba(242,169,59,0.18)",
      q: { en: "Already have a Ringo account?", fr: "Vous avez déjà un compte Ringo ?" },
      a: { en: "Yes, you can still buy the card — it just adds the card and extends your account with Basic access. It doesn't create a second account or replace what you already have.", fr: "Oui, vous pouvez quand même acheter la carte — elle ajoute simplement la carte et étend votre compte avec l'accès Basic. Elle ne crée pas un second compte et ne remplace pas ce que vous avez déjà." } },
    { icon: "upgrade", ring: "rgba(242,169,59,0.18)",
      q: { en: "What if I want to upgrade later?", fr: "Et si je veux passer à un plan supérieur plus tard ?" },
      a: { en: "You can upgrade to Pro or a Business plan anytime from your dashboard — the card and this offer don't lock you into Basic forever, it's just where you start.", fr: "Vous pouvez passer à Pro ou à un plan Business à tout moment depuis votre tableau de bord — la carte et cette offre ne vous enferment pas dans Basic pour toujours, c'est juste votre point de départ." } },
    { cta: true, icon: "check", animated: true, ring: "rgba(242,169,59,0.2)",
      q: { en: "Ready to grab your card?", fr: "Prêt à obtenir votre carte ?" },
      a: { en: "It'll take you just 2 minutes to fill the form and make your payment directly on the platform.", fr: "Il vous faudra seulement 2 minutes pour remplir le formulaire et effectuer votre paiement directement sur la plateforme." } }
  ];

  const stage = document.getElementById('stage');
  const progressEl = document.getElementById('progress');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const countEl = document.getElementById('count');
  const langBtn = document.getElementById('langBtn');
  let current = 0;

  async function init() {
  // Resolve the referrer's WhatsApp number (if any) before building the
  // CTA page below, so its links are correct from the very first paint.
  await resolveWhatsappNumber();

  pages.forEach(() => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.innerHTML = '<div class="fill"></div>';
    progressEl.appendChild(seg);
  });
  const segFills = () => document.querySelectorAll('.progress .fill');

  const refs = [];

  pages.forEach((p) => {
    const isFaq = !p.cta && !p.intro;
    const div = document.createElement('div');
    div.className = 'page' + (p.cta ? ' cta-page' : '');

    const badge = document.createElement('div');
    badge.className = 'badge' + (p.animated ? ' animated' : '');
    badge.style.setProperty('--ring-color', p.ring || 'rgba(242,169,59,0.18)');
    badge.style.setProperty('--icon-color', p.iconColor || 'var(--amber)');
    badge.innerHTML = '<div class="ring"></div>' + (p.animated ? '<div class="ripple"></div>' : '') + ICONS[p.icon];
    div.appendChild(badge);

    const q = document.createElement('h1');
    q.className = 'q';
    div.appendChild(q);

    const isViolet = p.iconColor === 'var(--violet)';
    const aBox = document.createElement('div');
    aBox.className = 'a-box box-dark';
    aBox.style.setProperty('--page-accent', p.iconColor || 'var(--amber)');
    aBox.style.setProperty('--a-text-color', isViolet ? '#DCD5FF' : '#FBE7C6');
    let label = null;
    if (isFaq) {
      label = document.createElement('div');
      label.className = 'a-label';
      aBox.appendChild(label);
    }
    const a = document.createElement('p');
    a.className = 'a';
    aBox.appendChild(a);
    div.appendChild(aBox);

    const ref = { p, q, a, label };

    if (p.cta) {
      const row = document.createElement('div');
      row.className = 'cta-row';

      const btn = document.createElement('a');
      btn.className = 'cta-btn';
      btn.href = SALES_LINK;
      btn.target = '_top';
      row.appendChild(btn);

      const waBtn = document.createElement('a');
      waBtn.className = 'cta-btn-secondary';
      waBtn.target = '_top';
      row.appendChild(waBtn);

      const sub = document.createElement('p');
      sub.className = 'cta-sub';
      row.appendChild(sub);

      div.appendChild(row);
      ref.ctaBtn = btn;
      ref.waBtn = waBtn;
      ref.sub = sub;
    }

    refs.push(ref);
    stage.appendChild(div);
  });

  function applyLocale() {
    const ui = UI[locale];
    document.documentElement.lang = locale;
    document.title = ui.title;
    refs.forEach((r) => {
      r.q.textContent = r.p.q[locale];
      r.a.textContent = r.p.a[locale];
      if (r.label) r.label.textContent = ui.answer;
      if (r.ctaBtn) r.ctaBtn.textContent = ui.ctaBtn;
      if (r.waBtn) {
        r.waBtn.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(ui.waMsg);
        r.waBtn.textContent = ui.notNow;
      }
      if (r.sub) r.sub.textContent = ui.sub;
    });
    backBtn.textContent = ui.back;
    nextBtn.textContent = current === pages.length - 1 ? ui.startOver : ui.next;
    langBtn.textContent = locale === 'en' ? 'FR' : 'EN';
  }

  function render() {
    document.querySelectorAll('.page').forEach((el, i) => el.classList.toggle('active', i === current));
    segFills().forEach((fill, i) => { fill.style.width = i <= current ? '100%' : '0%'; });
    backBtn.disabled = current === 0;
    nextBtn.textContent = current === pages.length - 1 ? UI[locale].startOver : UI[locale].next;
    countEl.textContent = (current + 1) + ' / ' + pages.length;
  }
  function goNext() { current = current < pages.length - 1 ? current + 1 : 0; render(); }
  function goBack() { if (current > 0) { current--; render(); } }

  document.getElementById('zoneRight').addEventListener('click', goNext);
  document.getElementById('zoneLeft').addEventListener('click', goBack);
  nextBtn.addEventListener('click', goNext);
  backBtn.addEventListener('click', goBack);
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') goNext(); if (e.key === 'ArrowLeft') goBack(); });

  langBtn.addEventListener('click', () => {
    locale = locale === 'en' ? 'fr' : 'en';
    try { localStorage.setItem(LOCALE_KEY, locale); } catch {}
    applyLocale();
  });

  let touchStartX = null;
  stage.addEventListener('touchstart', (e) => {
    // Let a tap that starts on a real link/button (e.g. the CTA buttons)
    // behave like a normal tap instead of being read as a swipe.
    if (e.target.closest('a, button')) { touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
  });
  stage.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    if (e.target.closest('a, button')) { touchStartX = null; return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? goNext() : goBack(); }
    touchStartX = null;
  });

  applyLocale();
  render();
  }

  init();
</script>
</body>
</html>
